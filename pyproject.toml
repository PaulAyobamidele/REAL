[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-av"
version = "0.1.0"
description = "REAL — Requirements Engineering for Autonomous vehicles that Learn."
readme = "README.md"
requires-python = ">=3.8,<3.11"
license = { file = "LICENSE" }
authors = [{ name = "REAL Contributors" }]
keywords = ["requirements-engineering", "autonomous-vehicles", "carla", "scenic", "grammatical-evolution", "fse"]
classifiers = [
    "Programming Language :: Python :: 3.8",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.109,<0.116",
    "uvicorn[standard]>=0.33,<0.35",
    "pydantic>=1.10.13,<2",
    "lark>=1.1,<2",
    "redis>=5.0,<6",
    "mlflow>=2.9,<3",
    "numpy>=1.24,<2",
    "requests>=2.31,<3",
    "deap>=1.4,<2",
    "tqdm>=4.60,<5",
    "pandas>=1.5,<2",
    "scikit-learn>=1.3,<2",
    "dotmap>=1.3,<2",
]

[project.scripts]
real-demo = "scripts.demo:main"

[project.optional-dependencies]
# mlserver is deliberately NOT listed here: every mlserver release up to and
# including 1.4.0.dev2 declares fastapi<=0.89.1, which conflicts with this
# project's fastapi>=0.109 - a real declared conflict, not just a stale range,
# confirmed via PyPI metadata. In practice fastapi 0.109.2 + mlserver 1.4.0
# work together fine (that's what setup_env.sh's environment actually runs),
# because installing them as separate `pip install` calls never enforces
# mlserver's constraint. Install it the same way: `pip install --no-deps
# mlserver==1.4.0.dev2` after the [ml] extra (see infra/hpc/carla.def).
ml = [
    "torch>=2.0,<3",
    "torchvision>=0.15,<1",
    "ultralytics>=8.0,<9",
    "opencv-python>=4.8,<5",
]
rl = ["gym>=0.26,<1"]
dev = ["pytest>=7.4,<9", "pytest-cov>=4.1,<6", "ruff>=0.6,<1", "mypy>=1.8,<2"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.25,<1"]

[tool.setuptools]
packages = [
    "scripts",
    "scripts.analysis",
    "scripts.evolve",
    "scripts.mlops",
    "scripts.mlops.yolo_models",
    "scripts.mlops.yolo_models.models",
    "scripts.redsl",
    "scripts.rl_env",
    "scripts.simulations",
    "scripts.templates",
    "scripts.templates.old",
]
py-modules = ["api_app", "app", "scenic_utility", "real_config"]

[tool.setuptools.package-data]
# grammar/kaos and grammar/example are dead (nothing imports them - superseded
# by scripts/redsl/grammar.py's Lark DSL) - excluded from packages/data on
# purpose, not shipped in the wheel.
"scripts" = [
    "analysis/*.json",
    "templates/old/*.bnf",
    "templates/general/*.template",
    "templates/example/*.bnf",
    "scenarios/*.temp",
    "scenarios/*.bnf",
    "scenarios/*.scenic",
]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["sim_env", "grape", "Scenic", "VerifAI", "scenario_runner", "mlruns", "infra/minio_data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
exclude = ["sim_env", "grape", "Scenic", "VerifAI", "scenario_runner", "scratch.py"]
