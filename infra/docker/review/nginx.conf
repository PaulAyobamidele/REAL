# The review page (static) and the authoring helper (serve.py, port 8765) on one address.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /authoring/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
